name: CI

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  build-linux-x8664:
    name: Linux x86_64
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
    - name: Checkout pgkmc
      uses: actions/checkout@v4

    - name: Compile with ${{ matrix.compiler }}
      run: |
        cd src
        make CC=${{ matrix.compiler }}
        file pgkmc | grep x86-64
      
    - name: Run tests
      run: |
        bash test/test.sh

  build-linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc]

    steps:
    - name: Checkout pgkmc
      uses: actions/checkout@v4

    - name: Compile with ${{ matrix.compiler }}
      uses: uraimo/run-on-arch-action@v3
      with:
        arch: aarch64
        distro: ubuntu22.04
        githubToken: ${{ github.token }}
        dockerRunArgs: |
          --volume "${PWD}:/pgkmc"
        install: |
          apt-get update -q -y
          apt-get install -q -y make ${{ matrix.compiler }} zlib1g-dev file
        run: |
            cd /pgkmc/src
            make CC=${{ matrix.compiler }} arm_neon=1 aarch64=1 -j
            file pgkmc | grep aarch64
            bash /pgkmc/test/test.sh

  build-mac-arm64:
    name: Mac ARM64
    runs-on: macos-14
    strategy:
      matrix:
        compiler: [clang]

    steps:
    - name: Checkout pgkmc
      uses: actions/checkout@v4

    - name: Compile with ${{ matrix.compiler }}
      run: |
        cd src
        make CC=${{ matrix.compiler }} arm_neon=1 aarch64=1 -j
        file pgkmc | grep arm64
    
    - name: Run tests
      run: |
        bash test/test.sh
        